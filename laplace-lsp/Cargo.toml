[package]
name = "laplace-lsp"
version = "0.1.0"
edition = "2021"
description = "Language server for .laplace files (semantic tokens, completion, diagnostics) and .lapkernel/.lapsampler files (diagnostics)"

[dependencies]
# The compiler's library and the sampler-file checker, both from the laplace
# repo at one pinned commit, so the editor checks exactly what that `laplace`
# release checks. laplace-sampler-syntax is the part of laplace-sample that
# needs no runtime: laplace-sample itself needs libclang to build and does
# not compile outside its own workspace (docs/editor/phase-0-report.md 0.3).
# Pinned to editor-api/syntax-crate (laplace PR #7) until it is merged; then
# to the commit on main, and to the v0.3.0 tag once that exists
# (docs/editor/open-questions.md, Q3 and Q7).
#
# To build against a local laplace checkout instead, add this to
# `.cargo/config.toml` (not committed) or uncomment it below:
#   [patch."https://github.com/mlatinov/laplace"]
#   laplace = { path = "../../laplace" }
#   laplace-sampler-syntax = { path = "../../laplace/laplace-sampler-syntax" }
laplace = { git = "https://github.com/mlatinov/laplace", rev = "1dd1b691d41906ac7c6782f19a9101ca556b2c23" }
laplace-sampler-syntax = { git = "https://github.com/mlatinov/laplace", rev = "1dd1b691d41906ac7c6782f19a9101ca556b2c23" }
tower-lsp = "0.20"
tokio = { version = "1", features = ["rt-multi-thread", "io-std", "io-util", "macros", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dashmap = "5"
once_cell = "1"
tempfile = "3"

[dev-dependencies]
tempfile = "3"
