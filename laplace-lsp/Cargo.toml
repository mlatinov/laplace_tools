[package]
name = "laplace-lsp"
version = "0.2.0"
edition = "2021"
description = "Language server for .laplace files (semantic tokens, completion, diagnostics) and .lapkernel/.lapsampler files (diagnostics, hover, completion, go-to-definition, signature help)"

[dependencies]
# The compiler's library and the sampler-file checker, both from the laplace
# repo at one pinned commit, so the editor checks exactly what that `laplace`
# release checks. laplace-sampler-syntax is the part of laplace-sample that
# needs no runtime: laplace-sample itself needs libclang to build and does
# not compile outside its own workspace (docs/editor/phase-0-report.md 0.3).
# Pinned to the laplace main commit that merged #7 to #12 (#10-#12: matrix
# builtins, density-only log_density, the kernel standard library); moves to
# the v0.3.0 tag once that exists (docs/editor/open-questions.md, Q3 and Q7).
#
# To build against a local laplace checkout instead, add this to
# `.cargo/config.toml` (not committed) or uncomment it below:
#   [patch."https://github.com/mlatinov/laplace"]
#   laplace = { path = "../../laplace" }
#   laplace-sampler-syntax = { path = "../../laplace/laplace-sampler-syntax" }
laplace = { git = "https://github.com/mlatinov/laplace", rev = "05d02d8d82912f415467ae89cf43cd56d07ce699" }
laplace-sampler-syntax = { git = "https://github.com/mlatinov/laplace", rev = "05d02d8d82912f415467ae89cf43cd56d07ce699" }
tower-lsp = "0.20"
tokio = { version = "1", features = ["rt-multi-thread", "io-std", "io-util", "macros", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dashmap = "5"
once_cell = "1"
tempfile = "3"

[dev-dependencies]
tempfile = "3"
