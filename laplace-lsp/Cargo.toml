[package]
name = "laplace-lsp"
version = "0.1.0"
edition = "2021"
description = "Language server for .laplace files (semantic tokens, completion, diagnostics)"

[dependencies]
laplace = { path = "../../laplace" }
tower-lsp = "0.20"
tokio = { version = "1", features = ["rt-multi-thread", "io-std", "io-util", "macros", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dashmap = "5"
once_cell = "1"

[dev-dependencies]
tempfile = "3"
